server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA：所有路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到后端 API（容器名 tf-backend）
    location /api/ {
        proxy_pass http://tf-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 必须的配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /ingest {
        proxy_pass http://tf-backend:8080/ingest;
        proxy_set_header Host $host;
    }
}
