# ===== 本地 MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/timeforest?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===== 本地 Redis（无密码）=====
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=

# ===== 开发环境自动初始化设置 =====
spring.jpa.hibernate.ddl-auto=update
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.vectorstore.redis.initialize-schema=true

# ===== 本地 API Key 与 JWT =====
spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
jwt.secret=${JWT_SECRET:timeforest-super-secret-key-please-change-in-production-min32chars}

# ===== ONNX 模型（本地从 resources/onnx/ 目录加载）=====
spring.ai.embedding.transformer.onnx.modelUri=classpath:/onnx/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=classpath:/onnx/tokenizer.json
