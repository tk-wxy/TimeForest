# ===== 线上 MySQL =====
# DB_HOST 建议改为 1Panel 中 MySQL 容器的名称或 IP
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:timeforest}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===== 线上 Redis =====
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ===== 线上安全设置 (禁止自动修改表结构) =====
spring.jpa.hibernate.ddl-auto=none
spring.ai.chat.memory.repository.jdbc.initialize-schema=never
spring.ai.vectorstore.redis.initialize-schema=false

# ===== 线上核心密钥 (严禁写死，必须从服务器环境变量读取) =====
spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
jwt.secret=${JWT_SECRET}