# ===== 生产环境 MySQL（宿主机/1Panel）=====
spring.datasource.url=jdbc:mysql://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/${DB_NAME:timeforest}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# ===== 生产环境 Redis（宿主机/1Panel）=====
spring.data.redis.host=${REDIS_HOST:host.docker.internal}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===== 生产环境 JPA / 向量库 ====
spring.jpa.hibernate.ddl-auto=update
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.vectorstore.redis.initialize-schema=true

# ===== 生产环境 API Key & JWT =====
spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
jwt.secret=${JWT_SECRET}

# ===== ONNX 模型（从 classpath 加载）=====
spring.ai.embedding.transformer.onnx.modelUri=classpath:/onnx/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=classpath:/onnx/tokenizer.json