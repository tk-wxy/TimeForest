version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: tf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-timeforest123}
      MYSQL_DATABASE: timeforest
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ai-agent-core
      dockerfile: Dockerfile
    container_name: tf-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: timeforest
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-timeforest123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-timeforest-super-secret-key-please-change-in-production-min32chars}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Gris
      dockerfile: Dockerfile
    container_name: tf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  redis_data:
