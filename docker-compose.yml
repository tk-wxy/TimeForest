version: "3.9"

# ═══════════════════════════════════════════
# TimeForest 生产环境部署 (Ubuntu + 1Panel)
# MySQL 与 Redis 由宿主机/1Panel 管理，此处不再定义
# ═══════════════════════════════════════════

services:

  backend:
    build:
      context: ./ai-agent-core
      dockerfile: Dockerfile
    container_name: tf-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 激活生产配置
      SPRING_PROFILES_ACTIVE: prod
      # DeepSeek API
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # MySQL — 指向宿主机（1Panel 安装的 MySQL）
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-timeforest}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-timeforest123}
      # Redis — 指向宿主机（1Panel 安装的 Redis）
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-timeforest-super-secret-key-please-change-in-production-min32chars}
      # 生产环境 — 关闭调试日志和自动初始化
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Gris
      dockerfile: Dockerfile
    container_name: tf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"